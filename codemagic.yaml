workflows:
  android-workflow:
    name: Android Debug Build
    max_build_duration: 60
    environment:
      flutter: 3.19.0
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
